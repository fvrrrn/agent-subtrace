[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-safety"
version = "0.1.0"
description = "Auditable dependency-graph and causal safety experiments"
requires-python = ">=3.11"
dependencies = ["tqdm>=4.66,<5"]

[project.scripts]
graph-safety = "graph_safety.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
